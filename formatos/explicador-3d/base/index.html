<!doctype html>
<!-- Explicador 3D (cara Loaded Dice). O render.py põe o cenas.json em window.PLANO e chama seek(t) quadro a quadro.
     O 3D (mundos.js + gente.js + objetos.js + motor.js) desenha o quadro inteiro (toon, contorno, dissolve, acabamento);
     por cima só vai a legenda: pequena, branca com sombra, perto de 70% da altura. Tudo depende só de t. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Explicador 3D</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
  /* legenda: pequena, branca com sombra, centralizada perto de 70% da altura, poucas palavras por vez */
  #leg { position: absolute; left: 110px; right: 110px; top: 1316px; height: 60px; text-align: center; color: #fff;
    font: 800 48px/60px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .3px;
    text-shadow: 0 3px 0 rgba(0,0,0,.75), 0 0 14px rgba(0,0,0,.65), 0 0 3px rgba(0,0,0,.9); white-space: nowrap; }
</style>
<script>window.pronto = false;</script>
</head>
<body>
<div id="palco">
  <div id="leg"></div>
</div>
<script>
  // import map dinâmico: o three vem da raiz do Estúdio (o render.py manda em PLANO.raiz)
  (function () {
    const R = (window.PLANO && window.PLANO.raiz) || '';
    const m = document.createElement('script'); m.type = 'importmap';
    m.textContent = JSON.stringify({ imports: { three: R + '/app/motores/3d/node_modules/three/build/three.module.js',
      'three/addons/': R + '/app/motores/3d/node_modules/three/examples/jsm/' } });
    document.currentScript.after(m);
  })();
</script>
<script type="module" src="motor.js"></script>
</body>
</html>
